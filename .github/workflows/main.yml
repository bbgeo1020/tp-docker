name: CI devops 2025
on:
  # Tests sur main et develop, et sur les pull requests
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-24.04
    steps:
      # Récupère le code du dépôt (historique complet pour SonarCloud)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Installe JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Build + tests unitaires et d'intégration (Testcontainers lance PostgreSQL)
      - name: Build and test with Maven
        run: mvn clean verify --file ./backend/pom.xml

      # Analyse de qualité du code avec SonarCloud (Quality Gate)
      - name: SonarCloud analysis
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=bbgeo1020_tp-docker -Dsonar.organization=bbgeo1020 -Dsonar.host.url=https://sonarcloud.io -Dsonar.token=${{ secrets.SONAR_TOKEN }} --file ./backend/pom.xml