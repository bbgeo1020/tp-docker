name: CI devops 2025
on:
  # On lance le pipeline sur main et develop
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-24.04
    steps:
      # Récupère le code du dépôt
      - uses: actions/checkout@v4

      # Installe JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Build + tests unitaires et d'intégration
      - name: Build and test with Maven
        run: mvn clean verify --file ./backend/pom.xml

  build-and-push-docker-image:
    # Ne tourne que si la compilation et les tests passent
    needs: test-backend
    runs-on: ubuntu-24.04
    steps:
      # Récupère le code du dépôt
      - name: Checkout code
        uses: actions/checkout@v4

       # Connexion à Docker Hub avec les secrets GitHub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      # Image du backend (dossier backend)
      - name: Build image and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-simple-api:latest
          # build sur toutes les branches, push seulement sur main
          push: ${{ github.ref == 'refs/heads/main' }}

      # Image de la base de données (dossier database)
      - name: Build image and push database
        uses: docker/build-push-action@v6
        with:
          context: ./database
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-database:latest
          push: ${{ github.ref == 'refs/heads/main' }}

      # Image du serveur web (dossier http-server)
      - name: Build image and push httpd
        uses: docker/build-push-action@v6
        with:
          context: ./http-server
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-httpd:latest
          push: ${{ github.ref == 'refs/heads/main' }}