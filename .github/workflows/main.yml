name: CI devops 2025
on:
  # On lance le pipeline sur main et develop
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-24.04
    steps:
      # Récupère le code du dépôt
      - uses: actions/checkout@v4

      # Installe JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Build + tests unitaires et d'intégration
      - name: Build and test with Maven
        run: mvn clean verify --file ./backend/pom.xml