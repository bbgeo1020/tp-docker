name: Build and push Docker images
on:
  # Se déclenche quand le workflow de test est terminé
  workflow_run:
    workflows: ["CI devops 2025"]   # doit être identique au "name" de main.yml
    types: [completed]
    branches: [main]                # uniquement la branche main

jobs:
  build-and-push-docker-image:
    # Seulement si le workflow de test a réussi
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      # Récupère le code du commit testé
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Connexion à Docker Hub avec les secrets GitHub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Image du backend
      - name: Build image and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-simple-api:latest
          push: true

      # Image de la base de données
      - name: Build image and push database
        uses: docker/build-push-action@v6
        with:
          context: ./database
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-database:latest
          push: true

      # Image du serveur web
      - name: Build image and push httpd
        uses: docker/build-push-action@v6
        with:
          context: ./http-server
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-httpd:latest
          push: true


      # Image du front
      - name: Build image and push front
        uses: docker/build-push-action@v6
        with:
          context: ./front
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-front:latest
          push: true

    # Déploiement automatique : Ansible lancé dans un conteneur Docker, secrets déchiffrés par le vault
  deploy:
    needs: build-and-push-docker-image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Prépare la clé SSH et le mot de passe du vault (depuis les secrets GitHub)
      - name: Set up secrets
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 400 ~/.ssh/id_rsa
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > ~/.vault_pass
          chmod 600 ~/.vault_pass

      # Construit l'image qui contient Ansible
      - name: Build Ansible image
        run: docker build -t ansible-runner ./ansible

      # Lance le playbook dans le conteneur
      - name: Deploy with Ansible (in Docker, with Vault)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/ansible:/ansible \
            -v $HOME/.ssh/id_rsa:/root/.ssh/id_rsa:ro \
            -v $HOME/.vault_pass:/root/.vault_pass:ro \
            -e ANSIBLE_HOST_KEY_CHECKING=False \
            ansible-runner \
            ansible-playbook -i inventories/setup.yml playbook.yml --vault-password-file /root/.vault_pass

      # Supprime les secrets du runner
      - name: Clean up secrets
        if: always()
        run: rm -f ~/.ssh/id_rsa ~/.vault_pass