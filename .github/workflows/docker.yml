name: Build and push Docker images
on:
  # Se déclenche quand le workflow de test est terminé
  workflow_run:
    workflows: ["CI devops 2025"]   # doit être identique au "name" de main.yml
    types: [completed]
    branches: [main]                # uniquement la branche main

jobs:
  build-and-push-docker-image:
    # Seulement si le workflow de test a réussi
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      # Récupère le code du commit testé
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Connexion à Docker Hub avec les secrets GitHub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Image du backend
      - name: Build image and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-simple-api:latest
          push: true

      # Image de la base de données
      - name: Build image and push database
        uses: docker/build-push-action@v6
        with:
          context: ./database
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-database:latest
          push: true

      # Image du serveur web
      - name: Build image and push httpd
        uses: docker/build-push-action@v6
        with:
          context: ./http-server
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-httpd:latest
          push: true

  # Déploiement automatique sur le serveur avec Ansible
  deploy:
    # Se lance seulement après la publication des images
    needs: build-and-push-docker-image
    runs-on: ubuntu-24.04
    steps:
      # Récupère le code (pour avoir le dossier ansible/)
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Installe Ansible sur le runner
      - name: Install Ansible
        run: pipx install --include-deps ansible

      # Écrit la clé SSH à l'endroit attendu par l'inventaire (~/.ssh/id_rsa)
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 400 ~/.ssh/id_rsa

      # Lance le playbook
      - name: Deploy with Ansible
        working-directory: ./ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: ansible-playbook -i inventories/setup.yml playbook.yml