---
- name: Run database container
  community.docker.docker_container:
    name: database
    image: "{{ docker_user }}/{{ image_db }}:latest"
    pull: always
    restart_policy: always
    networks:
      - name: app-network
    env:
      POSTGRES_DB: "{{ db_name }}"
      POSTGRES_USER: "{{ db_user }}"
      POSTGRES_PASSWORD: "{{ db_password }}"
    volumes:
      - db-data:/var/lib/postgresql/data
