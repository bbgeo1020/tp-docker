services:
  database:
    build: ./database
    container_name: database
    networks:
      - app-network
    env_file: .env
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: backend
    networks:
      - app-network
    depends_on:
      - database
    restart: unless-stopped

  httpd:
    build: ./http-server
    container_name: http-server
    ports:
      - "8090:80"
    networks:
      - app-network
    depends_on:
      - backend
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  db-data: