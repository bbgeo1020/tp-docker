services:
  database:
    build: ./database
    container_name: database
    networks:
      - back-network
    env_file: .env
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: backend
    networks:
      - front-network
      - back-network
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  httpd:
    build: ./http-server
    container_name: http-server
    ports:
      - "8090:80"
    networks:
      - front-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/80"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

networks:
  front-network:
    driver: bridge
  back-network:
    driver: bridge

volumes:
  db-data: